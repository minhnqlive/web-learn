
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        /* Body */
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin: 0;
        }

        /* Header */
        header {
            background-color: #2C3E50;
            padding: 20px;
        }

        /* Navigation */
        nav {
            background-color: #3498DB;
            padding: 15px;
        }

        /* Main */
        main {
            background-color: #F4F6F7;
            font-size: 18px;
            padding: 30px;
            min-height: 300px;
        }

        /* Footer */
        footer {
            background-color: #2C3E50;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* List items */
        li {
            display: inline-block;
            width: 150px;
        }

        /* Heading */
        h1 {
            text-align: center;
            font-family: Georgia, serif;
            color: white;
        }

        /* Paragraph */
        p {
            line-height: 1.6;
        }

        nav a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Welcome to my website. This is my CSS assignment.</p>
        </section>

        <section id="about">
            <h2>About</h2>
            <p>This page demonstrates HTML and CSS styling.</p>
        </section>

        <section id="contact">
            <h2>Contact</h2>
            <p>Thank you for visiting my website.</p>
        </section>
    </main>

    <footer>
        <p>Copyright 2026 - My Website</p>
    </footer>

</body>
</html>
